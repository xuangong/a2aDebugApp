<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2A Debug App</title>
    <script>
      // 主题初始化 - 默认浅色模式
      ;(function() {
        var mode = localStorage.getItem('a2a-theme-mode') || 'light'
        if (mode === 'dark') {
          document.documentElement.classList.add('dark')
        } else if (mode === 'system') {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
        // light 模式不需要添加任何 class，HTML 默认就是浅色
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
