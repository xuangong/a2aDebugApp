# electron-builder config

appId: com.a2a-debug.app
productName: A2A Debug App
copyright: Copyright © 2025 A2A Debug App

# Electron version
electronVersion: 39.5.1

# Directory config
directories:
  output: out
  buildResources: resources

# Compression
compression: normal

# ASAR packaging
asar: true

# Skip npm install
npmRebuild: false

# Included files
files:
  - dist/**/*
  - package.json

# Icon config (cross-platform)
icon: resources/icon

# macOS config
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64

# DMG config
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Windows config
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS installer config
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
